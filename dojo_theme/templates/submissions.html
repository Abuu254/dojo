{% extends "base.html" %}

{% block stylesheets %}
<style>
  /* Give the student list a subtle grey background */
  .student-list .list-group-item {
    background-color: #272829;
  }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <h2 class="mt-4">Admin – Submissions</h2>

  <form method="get" class="form-inline mb-3">
    <div class="input-group w-100">
      <input
        type="text"
        name="q"
        class="form-control"
        placeholder="Search by username…"
        value="{{ q }}"
      >
      <div class="input-group-append">
        <button class="btn btn-primary" type="submit">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
    {% if q %}
      <a href="{{ url_for('submissions.view') }}" class="btn btn-link ml-2">Clear</a>
    {% endif %}
  </form>

  <ul class="list-group student-list">
    {% for user in users %}
      <li class="list-group-item">
        <a href="{{ url_for('pwncollege_users.view_other', user_id=user.id) }}">
          {{ user.name }}
        </a>
      </li>
    {% endfor %}
    {% if not users %}
      <li class="list-group-item text-muted">No students found.</li>
    {% endif %}
  </ul>
</div>
{% endblock %}
